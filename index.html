<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>女婴女童 · 运动服饰开款方向</title>
<style>
  :root{
    --orange:#ff5a1f;
    --orange-deep:#e8440f;
    --orange-soft:#fff0e8;
    --ink:#1c1917;
    --ink-soft:#57534e;
    --line:#eeeae5;
    --bg:#ffffff;
    --cream:#faf6f1;
    --shadow:0 1px 2px rgba(28,25,23,.04), 0 8px 24px rgba(232,68,15,.05);
    --shadow-lg:0 10px 40px rgba(28,25,23,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px 80px}

  header.hero{padding:40px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:6px;flex:1;min-width:280px}
  .kicker{display:inline-flex;align-items:center;gap:8px;color:var(--orange-deep);font-weight:700;font-size:13px;letter-spacing:.16em;align-self:flex-start}
  .kicker::before{content:"";width:26px;height:2px;background:var(--orange);border-radius:2px}
  h1{font-size:clamp(26px,4.6vw,44px);font-weight:800;letter-spacing:-.01em;line-height:1.16}
  h1 .orange{color:var(--orange)}
  .sub{margin-top:10px;color:var(--ink-soft);font-size:14.5px;max-width:560px}
  .sub b{color:var(--orange-deep);font-weight:700}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{
    border:none;cursor:pointer;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;
    background:var(--cream);color:var(--ink);transition:.18s;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn.primary{background:var(--orange);color:#fff;border-color:transparent}
  .btn.primary:hover{background:var(--orange-deep)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line)}
  .btn.danger{background:#fff;color:#c2410c;border:1px solid #ffd8c7}
  .btn.sm{padding:7px 12px;font-size:12.5px}

  .editing [data-edit]{cursor:text;border-radius:6px;transition:box-shadow .15s}
  .editing [data-edit]:hover,
  .editing [data-edit]:focus{outline:1.6px dashed #ffb28f;outline-offset:3px;background:rgba(255,176,130,.06)}
  .editing [data-edit]:focus{outline-style:solid;outline-color:var(--orange)}

  .cats{position:sticky;top:0;z-index:20;background:linear-gradient(#ffffff 78%,rgba(255,255,255,0));padding:12px 0 14px}
  .cats .lab{font-size:11px;font-weight:700;letter-spacing:.14em;color:#a8a29e;margin-bottom:9px;text-transform:uppercase}
  .chiprow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;scrollbar-color:#e7e5e4 transparent}
  .chip{
    flex:0 0 auto;position:relative;white-space:nowrap;padding:11px 18px;border-radius:999px;cursor:pointer;
    background:var(--cream);border:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--ink-soft);
    transition:.18s;display:inline-flex;align-items:center;gap:8px;
  }
  .chip:hover{border-color:var(--orange);color:var(--orange-deep)}
  .chip.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:var(--shadow)}
  .chip .mini{display:none;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;flex:0 0 auto}
  .chip .mini:hover{background:rgba(255,255,255,.55)}
  .editing .chip .mini{display:inline-flex}
  .addcat{flex:0 0 auto;border:1.5px dashed var(--orange);color:var(--orange-deep);background:#fff;border-radius:999px;padding:11px 16px;font-weight:800;font-size:13.5px;cursor:pointer}

  /* 类目上款路径 */
  .pathbar{margin-top:4px;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pathbar .plab{display:inline-flex;align-items:center;gap:7px;color:var(--orange-deep);font-weight:800;font-size:13.5px;flex:0 0 auto;letter-spacing:.02em}
  .pathbar .plab::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
  .pathbar .ptxt{flex:1;min-width:200px;color:var(--ink-soft);font-size:14px;font-weight:600;line-height:1.7}
  .pathbar .ptxt .path-line{display:flex;align-items:center;gap:8px;padding:2px 0}
  .pathbar .ptxt .path-line::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--orange)}
  .pathbar .ptxt .sep{color:#c9b8ad;font-weight:400;margin:0 6px}
  .pathbar.hidden{display:none}
  .editing .pathbar .ptxt:hover,
  .editing .pathbar .ptxt:focus{outline:1.6px dashed #ffb28f;outline-offset:3px;background:rgba(255,176,130,.06)}

  .style-block{margin-top:34px;background:var(--cream);border:1px solid var(--line);border-radius:26px;padding:22px;overflow:hidden}
  .style-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}
  .style-head .l{display:flex;align-items:center;gap:14px}
  .style-icon{width:46px;height:46px;border-radius:14px;background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .style-block.festive .style-icon{background:#fff3e6}
  .style-block h2{font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:-.01em}
  .style-tag{font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:600}
  .style-desc{color:var(--ink-soft);font-size:13.5px;margin-top:4px}

  .subrow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  @media(max-width:760px){.subrow{grid-template-columns:1fr}}

  .subtype{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
  .subtype-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .subtype-head h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
  .subtype-head h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--orange)}
  .subtype-head .cnt{font-size:12px;color:#a8a29e;font-weight:600}
  .subtype-actions{display:flex;gap:8px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .img-card{position:relative;border-radius:14px;overflow:hidden;background:var(--cream);border:1px solid var(--line);display:flex;flex-direction:column;transition:.18s}
  .img-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:#f5d3c2}
  .img-card .ph{width:100%;aspect-ratio:4/5;background:linear-gradient(160deg,#fff4ec,#ffe6d6);display:flex;align-items:center;justify-content:center;color:#e8a183;font-size:52px;font-weight:800}
  .img-card img{width:100%;height:auto;display:block}
  .img-card .meta{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line)}
  .img-name{font-size:11px;color:#a8a29e;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dl{
    border:none;background:var(--orange-soft);color:var(--orange-deep);font-weight:800;font-size:12px;border-radius:999px;
    padding:6px 12px;cursor:pointer;transition:.15s;flex:0 0 auto;
  }
  .dl:hover{background:var(--orange);color:#fff}

  .img-edit{position:absolute;top:9px;right:9px;display:none;gap:6px}
  .editing .img-edit{display:flex}
  .img-edit button{width:26px;height:26px;border-radius:8px;border:none;background:rgba(255,255,255,.95);color:#57534e;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .img-edit button.rm:hover{background:#fee2d5;color:#c2410c}
  .img-edit button.goto:hover{background:var(--orange-soft);color:var(--orange-deep)}

  .addtile{
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    border:1.5px dashed #e5d4c8;border-radius:14px;background:#fffdfb;min-height:170px;
    color:#b8a99e;font-size:12.5px;font-weight:700;transition:.18s;
  }
  .addtile:hover{border-color:var(--orange);color:var(--orange-deep);background:#fff}
  .addtile .plus{width:38px;height:38px;border-radius:50%;background:var(--orange-soft);color:var(--orange-deep);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .editing .addtile{display:flex}
  .empty-note{display:none;color:#b8a99e;font-size:13px;text-align:center;padding:30px 10px;grid-column:1/-1}
  .editing .empty-note.on{display:block}

  .foot{margin-top:46px;padding-top:22px;border-top:1px solid var(--line);color:#a8a29e;font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .foot .key{color:var(--orange-deep);font-weight:700}

  .mode-banner{display:none;margin-top:14px;background:#fff6ee;border:1px dashed var(--orange);border-radius:12px;padding:9px 14px;color:var(--orange-deep);font-size:13px;font-weight:600}
  .editing .mode-banner{display:block}

  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;box-shadow:var(--shadow-lg);z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-bg{position:fixed;inset:0;background:rgba(28,25,23,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:60;backdrop-filter:blur(2px)}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:22px;padding:26px;width:100%;max-width:430px;box-shadow:var(--shadow-lg)}
  .modal h4{font-size:19px;font-weight:800;margin-bottom:6px}
  .modal p{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px}
  .field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;background:#fff;color:var(--ink);outline:none;transition:.15s;font-family:inherit}
  .field input:focus,.field select:focus{border-color:var(--orange)}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .modal .row .btn{padding:10px 20px}

  .uploadlist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .uploadlist .u{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
  .uploadlist .u.off{opacity:.55;text-decoration:line-through}
  .uploadlist .u .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .uploadlist .u .s{color:#a8a29e;font-size:11.5px;flex:0 0 auto}
  .uploadlist .u button{border:none;background:transparent;color:#c2410c;font-weight:700;cursor:pointer;font-size:12.5px;flex:0 0 auto}
  .hint{font-size:12px;color:#a8a29e;line-height:1.6}

  @media(max-width:600px){
    .style-block{padding:16px}
    header.hero{padding-top:28px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand">
      <span class="kicker" data-edit="kicker">KAIDIRECTION · 招商开款</span>
      <h1 data-edit="title">女婴女童 运动服饰<br>开款方向</h1>
      <p class="sub" data-edit="sub">面向商家的开款方向展示页 —— 点击类目切换，查看基础款 / 节庆款下的单件与多件方向，图片可点击预览并直接下载。</p>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="btnDev">🔧 开发者模式</button>
      <button class="btn ghost sm" id="btnPass" style="display:none" title="设置开启开发者模式的密码">🔒 设置密码</button>
      <button class="btn ghost sm" id="exportBtn" title="导出当前数据备份">导出</button>
    </div>
  </header>

  <div class="mode-banner">🔧 开发者模式已开启：点击任意文字即可编辑；图片可通过各分区「＋添加开款图片」上传到对应类目。</div>

  <nav class="cats">
    <div class="lab" data-edit="lab">开款类目 —— 点击切换</div>
    <div class="chiprow" id="chipRow"></div>
  </nav>

  <div class="pathbar" id="pathBar">
    <span class="plab">上款路径</span>
    <div class="ptxt" id="pathTxt" data-edit="path"></div>
  </div>

  <main id="mainArea"></main>

  <footer class="foot">
    <span data-edit="foot1">招商对接 · 女婴女童运动服饰 组</span>
    <span data-edit="foot2">提示：长按 / 点击图片可下载到本地</span>
  </footer>
</div>

<div id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h4 id="modalTitle">配置</h4>
    <p id="modalDesc"></p>
    <div id="modalBody"></div>
  </div>
</div>

<input type="file" id="fileInputUrl" accept="image/*" multiple style="display:none">

<script>
/* ============================================================
   数据模型
   结构：类目 => 两个风格「基础款/节庆款」 => 每个风格下「单件/多件」
   开发者模式：所有文字可编辑、图片可上传/替换/删除、类目可增删改
   商家浏览：单个类目的全部图片平铺展示，不折叠、不裁剪
   ============================================================ */
const STYLES = [ { id:"basic", icon:"👕" }, { id:"festive", icon:"🎉" } ];
const SUBTYPES = [ { id:"single" }, { id:"multi" } ];

const DEFAULT_TEXTS = {
  kicker:"KAIDIRECTION · 招商开款",
  title:"女婴女童 运动服饰\n开款方向",
  sub:"面向商家的开款方向展示页 —— 点击类目切换，查看基础款 / 节庆款下的单件与多件方向，图片可点击预览并直接下载。",
  lab:"开款类目 —— 点击切换",
  styleName:{ basic:"基础款", festive:"节庆款" },
  styleDesc:{ basic:"日常基础开款方向，主打百搭、耐穿、实穿", festive:"节庆主题开款方向，主打氛围感与主题设计" },
  styleTag:{ basic:"日常 · 百搭", festive:"节庆 · 主题" },
  subName:{ single:"单件", multi:"多件" },
  foot1:"招商对接 · 女婴女童运动服饰 组",
  foot2:"提示：长按 / 点击图片可下载到本地"
};

function deepMerge(base, over){
  const out = Array.isArray(base)?[...base]:{...base};
  for(const k in (over||{})){
    if(over[k] && typeof over[k]==="object" && !Array.isArray(over[k]) && base[k] && typeof base[k]==="object"){
      out[k]=deepMerge(base[k], over[k]);
    }else if(over[k]!=null){ out[k]=over[k]; }
  }
  return out;
}

function ph(label){
  const c1="#ffe9dc", c2="#ffd4bd";
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='${c1}'/><stop offset='1' stop-color='${c2}'/></linearGradient></defs>
    <rect width='400' height='500' fill='url(#g)'/>
    <circle cx='200' cy='210' r='70' fill='rgba(255,255,255,.55)'/>
    <text x='200' y='235' text-anchor='middle' font-family='sans-serif' font-size='70' fill='#e8a183'>${label}</text>
    <text x='200' y='415' text-anchor='middle' font-family='sans-serif' font-size='18' fill='#c06a43'>占位图 · 待替换</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

function seedData(){
  const mk = () => STYLES.map(s => ({ id:s.id, images:{ single:[ph("👕")], multi:[ph("☕")] } }));
  return [
    { name:"运动短裤", path:["女婴女童运动服饰 › 下装 › 运动短裤"], styles:mk() },
    { name:"打底裤",   path:["女婴女童运动服饰 › 下装 › 打底裤"],   styles:mk() },
    { name:"运动长裤", path:["女婴女童运动服饰 › 下装 › 运动长裤"], styles:mk() },
    { name:"运动上衣", path:["女婴女童运动服饰 › 上装 › 运动上衣"], styles:mk() },
    { name:"运动紧身衣", path:["女婴女童运动服饰 › 功能上装 › 运动紧身衣"], styles:mk() }
  ];
}

function defaultPath(name){ return "女婴女童运动服饰 › " + name; }
function normPath(p){ // 统一为数组，兼容旧数据字符串
  if(Array.isArray(p)) return p.filter(s=>String(s).trim()!=="").map(s=>String(s).trim());
  if(typeof p==="string" && p.trim()) return [p.trim()];
  return [];
}

const LSK = "kaikuan_direction_v2";
let state = { categories: seedData(), active: 0, editing:false, texts: deepMerge(DEFAULT_TEXTS,{}), passHash:"" };
let draftImg = { style:"basic", subtype:"single", replaceAt:null };
let renameIdx = 0;
let fileQueue = [];

// 简单哈希（非加密，仅用于避免明文存储）
function hashPass(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return "h"+h.toString(36); }

function load(){
  try{
    const raw = localStorage.getItem(LSK);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.categories) && d.categories.length){
        state.categories = d.categories;
        state.categories.forEach(c=>{ c.path = normPath(c.path!=null?c.path:defaultPath(c.name)); });
        state.active = d.active||0;
        state.texts = deepMerge(DEFAULT_TEXTS, d.texts||{});
        state.passHash = d.passHash||"";
        return;
      }
    }
  }catch(e){}
  state.categories = seedData();
  state.active = 0;
  state.texts = deepMerge(DEFAULT_TEXTS,{});
}
function save(){
  try{
    localStorage.setItem(LSK, JSON.stringify({categories:state.categories, active:state.active, texts:state.texts, passHash:state.passHash}));
  }catch(e){ toast("本地空间不足，图片可能未保存，建议改用图片URL"); }
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function T(key, sub){ return sub!=null ? (state.texts[key]&&state.texts[key][sub]!=null?state.texts[key][sub]:"") : (state.texts[key]!=null?state.texts[key]:""); }

/* ============================================================
   渲染
   ============================================================ */
function renderHead(){
  document.querySelectorAll("[data-edit]").forEach(el=>{
    const k=el.dataset.edit, idx=k.indexOf(":");
    const key = idx>-1?k.slice(0,idx):k, sub = idx>-1?k.slice(idx+1):null;
    if(key==="path"){ renderPath(); return; }
    if(sub!=null){ el.innerHTML = esc(T(key,sub)); return; }
    if(key==="title") el.innerHTML = esc(T("title")).split("\n").map(esc).join("<br>");
    else el.textContent = T(key);
  });
}

function renderPath(){
  const bar=document.getElementById("pathBar");
  const txt=document.getElementById("pathTxt");
  const cat=state.categories[state.active];
  const list = cat ? normPath(cat.path) : [];
  const empty = list.length===0;
  bar.classList.toggle("hidden", !cat);
  txt.dataset.empty = empty ? "1" : "0";
  txt.innerHTML = empty
    ? `<span style="color:#c9b8ad">（未设置上款路径，开发者模式下点击编辑，可输入多条、每行一条）</span>`
    : list.map(p=>`<div class="path-line">${esc(p).replace(/\s*›\s*/g, `<span class="sep">›</span>`)}</div>`).join("");
}

function renderChips(){
  const row = document.getElementById("chipRow");
  row.innerHTML = state.categories.map((c,i)=>{
    const on = i===state.active;
    return `<div class="chip ${on?'on':''}" data-i="${i}">
      <span>${esc(c.name)}</span>
      ${state.editing?`<span class="mini" data-ren="${i}" title="重命名">✎</span>`:""}
      ${state.editing?`<span class="mini" data-del="${i}" title="删除">×</span>`:""}
    </div>`;
  }).join("") + `<div class="addcat" id="addCat">＋ 新增类目</div>`;
}

function renderMain(){
  const main = document.getElementById("mainArea");
  const cat = state.categories[state.active];
  if(!cat){ main.innerHTML = `<div style="color:#b8a99e;text-align:center;padding:60px 10px">暂无类目，请在开发者模式中点击上方「＋ 新增类目」。</div>`; return; }
  main.innerHTML = STYLES.map(st => {
    const block = cat.styles.find(s=>s.id===st.id) || { images:{single:[],multi:[]} };
    const subs = SUBTYPES.map(su => {
      const imgs = block.images[su.id] || [];
      const subName = T("subName", su.id);
      return `<div class="subtype" data-style="${st.id}" data-sub="${su.id}">
        <div class="subtype-head">
          <h3 data-edit="subName:${su.id}"><span class="dot"></span>${esc(subName)}</h3>
          <div class="subtype-actions">
            <span class="cnt">${imgs.length} 张</span>
            <button class="btn sm dl-sub" data-style="${st.id}" data-sub="${su.id}">下载全部</button>
          </div>
        </div>
        <div class="grid">
          ${imgs.map((url,ix)=>{
            const fn = `${cat.name}_${st.id}_${su.id}_${ix+1}.jpg`;
            return `<figure class="img-card" data-style="${st.id}" data-sub="${su.id}" data-ix="${ix}">
              ${url?`<img src="${esc(url)}" alt="开款图片" loading="lazy">`:`<div class="ph">☁</div>`}
              <div class="img-edit">
                <button class="goto" data-style="${st.id}" data-sub="${su.id}" data-ix="${ix}" title="替换图片文件">⤴</button>
                <button class="rm" data-style="${st.id}" data-sub="${su.id}" data-ix="${ix}" title="删除">✕</button>
              </div>
              <div class="meta">
                <span class="img-name">${esc(fn)}</span>
                <button class="dl-sub" data-style="${st.id}" data-sub="${su.id}" data-ix="${ix}">下载</button>
              </div>
            </figure>`;
          }).join("")}
          <div class="addtile" data-style="${st.id}" data-sub="${su.id}">
            <span class="plus">＋</span><span>添加开款图片</span>
          </div>
          ${imgs.length===0?`<div class="empty-note on">暂无图片，点击「添加开款图片」上传</div>`:""}
        </div>
      </div>`;
    }).join("");
    return `<section class="style-block ${st.id==='festive'?'festive':''}">
      <div class="style-head">
        <div class="l">
          <div class="style-icon">${st.icon}</div>
          <div>
            <h2 data-edit="styleName:${st.id}">${esc(T("styleName",st.id))}</h2>
            <div class="style-desc" data-edit="styleDesc:${st.id}">${esc(T("styleDesc",st.id))}</div>
          </div>
        </div>
        <span class="style-tag" data-edit="styleTag:${st.id}">${esc(T("styleTag",st.id))}</span>
      </div>
      <div class="subrow">${subs}</div>
    </section>`;
  }).join("");
}

function renderAll(){
  renderHead();
  renderChips();
  renderMain();
  applyMode();
}

function applyMode(){
  document.body.classList.toggle("editing", state.editing);
  const b=document.getElementById("btnDev");
  b.textContent = state.editing?"✅ 开发者模式 已开启（点击退出）":"🔧 开发者模式";
  b.classList.toggle("primary", state.editing);
  b.classList.toggle("ghost", !state.editing);
  // 设置密码按钮仅开发者模式下显示；显示当前是否有密码保护
  const bp=document.getElementById("btnPass");
  bp.style.display = state.editing ? "" : "none";
  bp.textContent = state.passHash ? "🔑 修改密码" : "🔒 设置密码";
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.contentEditable = state.editing ? "true" : "false";
  });
}
document.getElementById("btnPass").onclick=()=>{ openPass("set"); };

/* ============================================================
   下载
   ============================================================ */
function downloadUrl(url, name){
  const a=document.createElement("a");
  a.href=url; a.download=name; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
function slotImages(styleId, subId){
  const cat=state.categories[state.active];
  return (cat&&cat.styles.find(s=>s.id===styleId)?.images[subId])||[];
}
document.getElementById("mainArea").addEventListener("click", e=>{
  const bt = e.target.closest("button");
  if(!bt) return;
  const st=bt.dataset.style, su=bt.dataset.sub;
  const base=state.categories[state.active]?state.categories[state.active].name:"img";
  if(bt.classList.contains("dl-sub")){
    if(bt.dataset.ix!=null){
      const u=slotImages(st,su)[+bt.dataset.ix];
      if(u) downloadUrl(u, `${base}_${st}_${su}_${+bt.dataset.ix+1}.jpg`);
    }else{
      const urls=slotImages(st,su);
      if(!urls.length){ toast("该分组暂无图片"); return; }
      urls.forEach((u,i)=> setTimeout(()=>downloadUrl(u, `${base}_${st}_${su}_${i+1}.jpg`), i*220));
      toast(`正在批量下载 ${urls.length} 张`);
    }
    return;
  }
  if(bt.classList.contains("rm")){
    if(!state.editing) return;
    const ix=+bt.dataset.ix;
    state.categories[state.active].styles.find(s=>s.id===st).images[su].splice(ix,1);
    save(); renderMain(); toast("已删除该图片");
    return;
  }
  if(bt.classList.contains("goto") && state.editing){
    draftImg={ style:st, subtype:su, replaceAt:+bt.dataset.ix };
    pickAndSwap();
    return;
  }
});

document.getElementById("mainArea").addEventListener("click", e=>{
  const t=e.target.closest(".addtile");
  if(t && state.editing){
    draftImg={ style:t.dataset.style, subtype:t.dataset.sub, replaceAt:null };
    openModal("addImg");
  }
});

/* ============================================================
   类目
   ============================================================ */
document.getElementById("chipRow").addEventListener("click", e=>{
  const delEl = e.target.closest("[data-del]");
  if(delEl && state.editing){
    const i=+delEl.dataset.del;
    state.categories.splice(i,1);
    if(state.active>=state.categories.length) state.active=Math.max(0,state.categories.length-1);
    save(); renderAll(); toast("已删除类目");
    return;
  }
  const renEl = e.target.closest("[data-ren]");
  if(renEl && state.editing){
    renameIdx=+renEl.dataset.ren;
    openModal("renameCat"); return;
  }
  if(e.target.id==="addCat" && state.editing){ openModal("addCat"); return; }
  const chip=e.target.closest(".chip");
  if(chip){ state.active=+chip.dataset.i; save(); renderAll(); }
});

/* ============================================================
   可编辑文字：失焦保存
   ============================================================ */
document.addEventListener("focusout", e=>{
  const el = e.target.closest ? e.target.closest("[data-edit]") : null;
  if(!el || !state.editing) return;
  const k = el.dataset.edit, idx = k.indexOf(":");
  const key = idx>-1 ? k.slice(0,idx) : k;
  const sub = idx>-1 ? k.slice(idx+1) : null;
  const v = el.innerText.replace(/\u00a0/g," ").trim();
  if(key==="path"){ // 路径属于当前类目，按换行拆分为多条保存
    const cat=state.categories[state.active];
    if(cat){
      cat.path = v.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      save(); renderPath(); toast("上款路径已保存"); return;
    }
  }
  if(sub) state.texts[key][sub]=v; else state.texts[key]=v;
  save();
  toast("文字已保存");
});
document.addEventListener("keydown", e=>{
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !state.editing) return;
  // 上款路径允许回车换行录入多条；其余文字仍回车即保存
  if(e.key==="Enter" && el.dataset.edit!=="title" && el.dataset.edit!=="path"){ e.preventDefault(); el.blur(); }
});

/* ============================================================
   弹窗
   ============================================================ */
const modalBg=document.getElementById("modalBg"), modalTitle=document.getElementById("modalTitle"),
      modalDesc=document.getElementById("modalDesc"), modalBody=document.getElementById("modalBody");
function hideModal(){ modalBg.classList.remove("show"); modalBody.innerHTML=""; }
modalBg.addEventListener("click", e=>{ if(e.target===modalBg) hideModal(); });

function mkStyles(label){
  return STYLES.map(s => ({ id:s.id, images:{ single:[ph(label)], multi:[ph(label)] } }));
}

function openModal(kind){
  if(kind==="addCat"){
    modalTitle.textContent="新增类目";
    modalDesc.textContent="在下方输入类目名称，例如：运动短裤。新增后自动切换到该类目。";
    modalBody.innerHTML=`<div class="field"><label>类目名称</label><input id="m_cat_name" placeholder="如：运动短裤" maxlength="20"></div>
      <div class="row"><button class="btn ghost" id="m_cancel">取消</button><button class="btn primary" id="m_ok">添加</button></div>`;
    modalBg.classList.add("show");
    setTimeout(()=>{ const i=document.getElementById("m_cat_name"); i.focus(); },50);
  } else if(kind==="renameCat"){
    modalTitle.textContent="重命名类目";
    modalDesc.textContent="修改该开款类目的展示名称。";
    const cur=state.categories[renameIdx].name;
    modalBody.innerHTML=`<div class="field"><label>类目名称</label><input id="m_cat_name" value="${esc(cur)}" maxlength="20"></div>
      <div class="row"><button class="btn ghost" id="m_cancel">取消</button><button class="btn primary" id="m_ok">保存</button></div>`;
    modalBg.classList.add("show");
    setTimeout(()=>{ const i=document.getElementById("m_cat_name"); i.select(); },50);
  } else if(kind==="addImg"){
    const cat=state.categories[state.active];
    const stn=T("styleName",draftImg.style), sun=T("subName",draftImg.subtype);
    modalTitle.textContent = draftImg.replaceAt!=null?"替换图片":"添加开款图片";
    modalDesc.textContent=`当前位置：${esc(cat.name)} · ${stn} · ${sun}`;
    modalBody.innerHTML=`
      <div class="field"><label>方式一 · 从本地上传（可多选文件，上传到该类目）</label>
        <button class="btn ghost sm" id="m_pick">📁 选择图片文件</button>
        <div class="uploadlist" id="m_list"></div>
      </div>
      <div class="field"><label>方式二 · 粘贴图片 URL</label>
        <input id="m_url" placeholder="https://... .jpg / .png">
      </div>
      <div class="hint">上传图片保存在本页数据中；图片较多或高清时建议用图片URL，商家可下载原图。单张超过约2MB请改用URL方式。</div>
      <div class="row"><button class="btn ghost" id="m_cancel">取消</button><button class="btn primary" id="m_ok">${draftImg.replaceAt!=null?"替换图片":"添加图片"}</button></div>`;
    modalBg.classList.add("show");
    fileQueue=[];
    const list=document.getElementById("m_list");
    document.getElementById("m_pick").onclick=()=>{ fileInputUrl.click(); };
    fileInputUrl.onchange=()=>{
      fileQueue=Array.from(fileInputUrl.files).map(f=>({file:f,ok:true}));
      renderQueue(list,fileQueue);
      fileInputUrl.value="";
    };
  }
  document.getElementById("m_cancel").onclick=hideModal;
  document.getElementById("m_ok").onclick=()=>{
    if(kind==="addCat"){
      const v=document.getElementById("m_cat_name").value.trim();
      if(!v){ toast("请输入类目名称"); return; }
      state.categories.push({ name:v, path: [defaultPath(v)], styles: mkStyles("👕") });
      state.active=state.categories.length-1;
      save(); renderAll(); hideModal(); toast("已新增类目");
    } else if(kind==="renameCat"){
      const v=document.getElementById("m_cat_name").value.trim();
      if(!v){ toast("请输入名称"); return; }
      state.categories[renameIdx].name=v;
      save(); renderAll(); hideModal(); toast("类目已重命名");
    } else if(kind==="addImg"){
      const url=document.getElementById("m_url").value.trim();
      const target=state.categories[state.active].styles.find(s=>s.id===draftImg.style).images[draftImg.subtype];
      let added=0;
      if(fileQueue.length){
        fileQueue.forEach(q=>{ if(q.ok && q.data){ if(draftImg.replaceAt!=null){ target[draftImg.replaceAt]=q.data; added++; draftImg.replaceAt=null; } else { target.push(q.data); added++; } } });
      }
      if(url){
        if(draftImg.replaceAt!=null){ target[draftImg.replaceAt]=url; added++; draftImg.replaceAt=null; }
        else { target.push(url); added++; }
      }
      if(added){ save(); renderMain(); hideModal(); toast(`已添加 ${added} 张`); }
      else toast("请选择图片或填写URL");
    }
  };
}

function renderQueue(list, arr){
  list.innerHTML = arr.map((q,i)=>`<div class="u ${q.ok?'':'off'}"><span class="n">${esc(q.file.name)}</span>${q.ok?`<button data-rm="${i}">移除</button>`:`<span class="s">过大/失败</span>`}</div>`).join("");
  list.querySelectorAll("button[data-rm]").forEach(b=>b.onclick=e=>{
    const i=+e.target.dataset.rm;
    arr.splice(i,1); renderQueue(list,arr);
  });
}

function readFileAsDataUrl(file, cb){
  if(file.size > 2.2*1024*1024){ cb(null,false); return; }
  const r=new FileReader();
  r.onload=()=>cb(r.result,true);
  r.onerror=()=>cb(null,false);
  r.readAsDataURL(file);
}
function pickAndSwap(){
  const tmp=document.createElement("input");
  tmp.type="file"; tmp.accept="image/*";
  tmp.onchange=()=>{
    const f=tmp.files[0];
    if(!f) return;
    readFileAsDataUrl(f,(data,ok)=>{
      if(!ok){ toast("文件过大，请改用URL方式"); return; }
      const target=state.categories[state.active].styles.find(s=>s.id===draftImg.style).images[draftImg.subtype];
      target[draftImg.replaceAt]=data;
      save(); renderMain(); toast("图片已替换");
    });
  };
  tmp.click();
}
document.getElementById("fileInputUrl").addEventListener("change", e=>{
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  files.forEach(f=>readFileAsDataUrl(f,(data,ok)=>{
    const q=fileQueue.find(x=>x.file===f); if(q){ q.data=data; q.ok=!!ok; }
    const list=document.getElementById("m_list"); if(list) renderQueue(list,fileQueue);
  }));
});

/* ============================================================
   开发者模式密码
   ============================================================ */
function openPass(mode){
  modalTitle.textContent = mode==="unlock" ? "解锁开发者模式" : "设置开发者模式密码";
  modalDesc.textContent = mode==="unlock"
    ? "此页面已设置开启密码，请输入密码以进入开发者模式。"
    : "设置后，商家每次进入开发者模式都需输入此密码。留空则保存当前设置。";
  if(mode==="unlock"){
    modalBody.innerHTML=`<div class="field"><label>请输入密码</label><input type="password" id="m_pass" placeholder="输入开启密码"></div>
      <div class="row"><button class="btn ghost" id="m_cancel">取消</button><button class="btn primary" id="m_ok">解锁</button></div>`;
  } else {
    modalBody.innerHTML=`<div class="field"><label>新密码</label><input type="password" id="m_pass" placeholder="要设置的密码"></div>
      <div class="field"><label>确认新密码</label><input type="password" id="m_pass2" placeholder="再次输入"></div>
      <div class="hint">密码保存在本地，用于限制商家进入开发者模式。</div>
      <div class="row"><button class="btn ghost" id="m_cancel">取消</button><button class="btn danger" id="m_clear">清除密码</button><button class="btn primary" id="m_ok">保存</button></div>`;
  }
  modalBg.classList.add("show");
  let passMode=mode;
  document.getElementById("m_cancel").onclick=hideModal;
  document.getElementById("m_ok").onclick=()=>{
    if(passMode==="unlock"){
      const v=document.getElementById("m_pass").value;
      if(hashPass(v)===state.passHash){ hideModal(); state.editing=true; renderAll(); toast("开发者模式已开启"); }
      else { toast("密码错误"); document.getElementById("m_pass").value=""; document.getElementById("m_pass").focus(); }
    } else {
      const v=document.getElementById("m_pass").value;
      const v2=document.getElementById("m_pass2").value;
      if(!v){ toast("请输入密码，或点击「清除密码」关闭密码保护"); return; }
      if(v!==v2){ toast("两次输入的密码不一致"); return; }
      state.passHash=hashPass(v); save(); hideModal(); toast("密码已设置，进入开发者模式需输入密码");
    }
  };
  if(passMode==="unlock"){
    setTimeout(()=>{ const i=document.getElementById("m_pass"); i.focus(); },50);
  } else {
    document.getElementById("m_clear").onclick=()=>{
      state.passHash=""; save(); hideModal(); toast("已清除密码保护");
    };
  }
}

/* ============================================================
   顶部按钮 / 导出 / 预览
   ============================================================ */
document.getElementById("btnDev").onclick=()=>{
  if(state.editing){ // 退出无需密码
    state.editing=false; renderAll(); toast("已退出开发者模式"); return;
  }
  // 开启：若已设置密码需验证
  if(state.passHash){ openPass("unlock"); }
  else { state.editing=true; renderAll(); toast("已开启开发者模式（建议设置密码）"); }
};
document.getElementById("exportBtn").onclick=()=>{
  const catCfg=state.categories.map(c=>({name:c.name, path:c.path, styles:c.styles}));
  const payload=JSON.stringify({categories:catCfg, active:state.active, texts:state.texts, passHash:state.passHash},null,2);
  downloadUrl("data:application/json;charset=utf-8,"+encodeURIComponent(payload),"开款方向数据.json");
  toast("已导出数据 JSON");
};
document.getElementById("mainArea").addEventListener("click", e=>{
  const img=e.target.closest("img");
  if(img){ window.open(img.getAttribute("src"),"_blank"); }
});

/* ============================================================
   初始化
   ============================================================ */
load();
renderAll();
</script>
